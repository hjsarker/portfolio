name: Capture public project previews
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-previews.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Capture public website screenshots
        run: node scripts/capture-project-previews.cjs
      - name: Commit verified public preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add actual public project screenshots"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
