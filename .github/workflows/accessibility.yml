name: Portfolio accessibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/accessibility.yml'
      - 'tests/accessibility-audit.cjs'
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0 @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local portfolio
        run: python3 -m http.server 8765 >/tmp/portfolio-server.log 2>&1 &
      - name: Run homepage and case-study accessibility checks
        run: node tests/accessibility-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-audit-report
          path: accessibility-report.json
          if-no-files-found: ignore
