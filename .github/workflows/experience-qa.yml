name: Interactive experience browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'design.css'
      - 'experience-explorer.js'
      - 'tests/experience-smoke.cjs'
      - 'tests/vercel-health.cjs'
      - 'virtual-hillol.js'
      - 'virtual-hillol-api/**'
      - '.github/workflows/experience-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend syntax
        run: |
          node --check experience-explorer.js
          node --check tests/experience-smoke.cjs
          node --check virtual-hillol-api/api/chat.js
          node --check virtual-hillol-api/api/health.js
          node --test virtual-hillol-api/tests/*.test.cjs
      - name: Check deployed Vercel health and portfolio CORS
        run: node tests/vercel-health.cjs
      - name: Install Chromium for accessibility and interaction smoke tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify HRC walkthrough and six employer entries on desktop and mobile
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          sleep 2
          node tests/experience-smoke.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-experience-previews
          path: qa-*.png
          if-no-files-found: ignore
